<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة Project Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    body.font-english { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">
  <div class="min-h-screen flex flex-col lg:flex-row">
    <header class="lg:hidden border-b border-white/5 bg-white/5 backdrop-blur-sm px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div data-role="mobile-badge" class="h-11 w-11 rounded-2xl bg-white/10 text-white flex items-center justify-center text-lg font-semibold">PK</div>
        <div>
          <p data-role="mobile-brand-name" class="font-semibold"></p>
          <p data-role="mobile-brand-tagline" class="text-xs text-slate-300"></p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div data-role="language-switcher" class="inline-flex rounded-xl border border-white/10 p-1 bg-white/5"></div>
        <button id="sidebarToggle" class="inline-flex items-center gap-2 rounded-xl bg-white/10 px-4 py-2 text-sm font-semibold text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span data-role="open-label">فتح القائمة</span>
        </button>
      </div>
    </header>

    <div id="sidebarBackdrop" class="fixed inset-0 z-40 bg-black/60 opacity-0 pointer-events-none transition-opacity lg:hidden"></div>

    <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-80 max-w-full transform translate-x-full border-l border-white/10 bg-slate-900/95 backdrop-blur-xl px-6 py-8 space-y-8 transition-transform duration-300 lg:static lg:translate-x-0 lg:w-80 lg:border-l-0 lg:bg-slate-900/60">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <div data-role="brand-badge" class="h-12 w-12 rounded-2xl bg-white/10 text-white flex items-center justify-center text-lg font-semibold">PK</div>
          <div>
            <p data-role="brand-name" class="text-lg font-semibold"></p>
            <p data-role="brand-tagline" class="text-sm text-slate-300"></p>
          </div>
        </div>
        <div data-role="sidebar-actions" class="flex items-center gap-2">
          <div data-role="language-switcher" class="hidden lg:inline-flex rounded-xl border border-white/10 bg-white/5 p-1"></div>
          <button id="sidebarClose" class="lg:hidden inline-flex items-center gap-2 rounded-xl border border-white/10 px-3 py-2 text-xs text-slate-200">
            <span data-role="close-label">إغلاق</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <nav data-role="sidebar-nav" class="space-y-2"></nav>
      <div data-role="sidebar-highlight"></div>
    </aside>

    <main class="flex-1 px-4 py-8 lg:px-12 lg:py-10 space-y-10">
      <div data-role="main-header" class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between"></div>
      <section data-role="stats" class="grid gap-6 md:grid-cols-2 xl:grid-cols-4"></section>
      <section data-role="panels" class="grid gap-6 xl:grid-cols-4"></section>
    </main>
  </div>

  <script src="dashboard-common.js"></script>
  <script>
    initDashboard({
      defaultLang: 'ar',
      meta: {
        title: {
          ar: 'لوحة Project Kanban',
          en: 'Project Kanban Dashboard'
        }
      },
      actions: {
        open: { ar: 'فتح القائمة', en: 'Open menu' },
        close: { ar: 'إغلاق', en: 'Close' }
      },
      brand: {
        badge: 'PK',
        name: { ar: 'Project Kanban', en: 'Project Kanban' },
        tagline: { ar: 'تنظيم مهام الفرق', en: 'Organise your delivery work' }
      },
      theme: {
        accentGradient: 'from-sky-400 via-indigo-400 to-emerald-300',
        accentText: 'text-sky-200',
        highlightBg: 'bg-sky-400/15 border-sky-300/30',
        badgeBg: 'bg-sky-400/25',
        badgeText: 'text-white'
      },
      nav: [
        { id: 'overview', icon: 'chart-bar', label: { ar: 'نظرة عامة', en: 'Overview' }, badge: { ar: 'سبSprint 18', en: 'Sprint 18' } },
        { id: 'backlog', icon: 'folder', label: { ar: 'قائمة الانتظار', en: 'Backlog' } },
        { id: 'progress', icon: 'sparkles', label: { ar: 'قيد التنفيذ', en: 'In progress' } },
        { id: 'done', icon: 'trophy', label: { ar: 'منجز', en: 'Done' } }
      ],
      highlight: {
        label: { ar: 'مرئيات السبرينت', en: 'Sprint insight' },
        value: '45 مهمة ضمن النطاق',
        description: {
          ar: 'أولوية التركيز على تحسين الأداء في عمود قيد التنفيذ. تم تحديث البيانات منذ 5 دقائق.',
          en: 'Focus on throughput in the In Progress lane. Data synced 5 minutes ago.'
        }
      },
      header: {
        title: { ar: 'كانبان المشروع', en: 'Project Kanban' },
        subtitle: {
          ar: 'أربعة أعمدة منظمة مع بطاقات ملونة وصور رمزية للفريق وأدوات بحث وإضافة مهام.',
          en: 'Four organised columns with colourful cards, team avatars, and quick actions.'
        },
        primary: { ar: 'إضافة مهمة جديدة', en: 'Add new task' },
        secondary: { ar: 'بحث عن بطاقة', en: 'Search cards' }
      },
      stats: [
        { icon: 'folder', label: { ar: 'المهام في القائمة', en: 'Backlog items' }, value: '18', delta: { ar: '-6 بعد التصفية', en: '-6 after grooming' }, trend: 'positive' },
        { icon: 'sparkles', label: { ar: 'قيد التنفيذ', en: 'In progress' }, value: '11', delta: { ar: '+2 اليوم', en: '+2 today' }, trend: 'negative' },
        { icon: 'users', label: { ar: 'توزيع الحمل', en: 'Team load' }, value: '78%', delta: { ar: '+5% بسبب الإجازات', en: '+5% due to PTO' }, trend: 'negative' },
        { icon: 'trophy', label: { ar: 'منجز هذا الأسبوع', en: 'Completed this week' }, value: '24', delta: { ar: '+8 مقابل الأسبوع الماضي', en: '+8 vs last week' }, trend: 'positive' }
      ],
      panels: [
        {
          id: 'backlog-column',
          type: 'list',
          span: 'xl:col-span-1',
          title: { ar: 'Backlog', en: 'Backlog' },
          action: { ar: '3 عناصر بحاجة للمراجعة', en: '3 cards need review' },
          items: [
            { icon: 'sparkles', title: { ar: 'EPIC-24: تحسين البحث', en: 'EPIC-24: Improve search' }, subtitle: { ar: 'مالك المهمة: رانيا', en: 'Owner: Rania' }, value: '💡', delta: { ar: 'أولوية عالية', en: 'High priority' } },
            { icon: 'users', title: { ar: 'STORY-81: لوحة مراقبة', en: 'STORY-81: Monitoring board' }, subtitle: { ar: 'مالك المهمة: سامر', en: 'Owner: Samer' }, value: '📝', delta: { ar: 'جاهز للتقدير', en: 'Ready for sizing' } },
            { icon: 'calendar', title: { ar: 'BUG-142: إصلاح إشعارات', en: 'BUG-142: Fix notifications' }, subtitle: { ar: 'مالك المهمة: ليلى', en: 'Owner: Laila' }, value: '🐞', delta: { ar: 'تحت المتابعة', en: 'Under triage' } }
          ]
        },
        {
          id: 'todo-column',
          type: 'list',
          span: 'xl:col-span-1',
          title: { ar: 'To Do', en: 'To Do' },
          action: { ar: 'تم السحب منذ قليل', en: 'Pulled moments ago' },
          items: [
            { icon: 'users', title: { ar: 'TASK-331: إعداد لوحة التسعير', en: 'TASK-331: Pricing board setup' }, subtitle: { ar: 'مالك المهمة: عادل', en: 'Owner: Adel' }, value: '👥', delta: { ar: 'مهمة مشتركة', en: 'Pairing session' } },
            { icon: 'sparkles', title: { ar: 'TASK-338: تحسين الأداء', en: 'TASK-338: Performance tune' }, subtitle: { ar: 'مالك المهمة: سارة', en: 'Owner: Sarah' }, value: '⚙️', delta: { ar: 'جاهز للبدء', en: 'Ready to start' } }
          ]
        },
        {
          id: 'in-progress-column',
          type: 'list',
          span: 'xl:col-span-1',
          title: { ar: 'In Progress', en: 'In Progress' },
          action: { ar: 'الزمن المتوسط 2.1 يوم', en: 'Avg age 2.1 days' },
          items: [
            { icon: 'sparkles', title: { ar: 'TASK-312: دمج نظام الهوية', en: 'TASK-312: Identity integration' }, subtitle: { ar: 'مالك المهمة: يوسف', en: 'Owner: Youssef' }, value: '🔄', delta: { ar: 'بقي 40%', en: '40% remaining' } },
            { icon: 'users', title: { ar: 'TASK-319: تجربة واجهة جديدة', en: 'TASK-319: New UI experiment' }, subtitle: { ar: 'مالك المهمة: نورة', en: 'Owner: Nora' }, value: '🎨', delta: { ar: 'جلسة مراجعة اليوم', en: 'Review today' } },
            { icon: 'calendar', title: { ar: 'TASK-327: إعداد الاختبارات', en: 'TASK-327: Test harness setup' }, subtitle: { ar: 'مالك المهمة: طارق', en: 'Owner: Tarek' }, value: '🧪', delta: { ar: 'بانتظار الموافقة', en: 'Awaiting approval' } }
          ]
        },
        {
          id: 'done-column',
          type: 'list',
          span: 'xl:col-span-1',
          title: { ar: 'Done', en: 'Done' },
          action: { ar: 'تم الإغلاق خلال 24 ساعة', en: 'Closed within 24h' },
          items: [
            { icon: 'sparkles', title: { ar: 'TASK-298: دليل الإعداد', en: 'TASK-298: Setup guide' }, subtitle: { ar: 'مالك المهمة: ريم', en: 'Owner: Reem' }, value: '✅', delta: { ar: 'جاهز للإطلاق', en: 'Ready to launch' } },
            { icon: 'users', title: { ar: 'BUG-135: إصلاح الهواتف', en: 'BUG-135: Mobile fix' }, subtitle: { ar: 'مالك المهمة: مالك', en: 'Owner: Malik' }, value: '✅', delta: { ar: 'تم التحقق', en: 'QA verified' } },
            { icon: 'calendar', title: { ar: 'TASK-300: تحديث الوثائق', en: 'TASK-300: Docs refresh' }, subtitle: { ar: 'مالك المهمة: جمانة', en: 'Owner: Jumana' }, value: '✅', delta: { ar: 'نُشر بالأمس', en: 'Published yesterday' } }
          ]
        },
        {
          id: 'health',
          type: 'progress',
          span: 'xl:col-span-4',
          title: { ar: 'صحة السبرينت', en: 'Sprint health' },
          items: [
            { title: { ar: 'الالتزام مقابل الانجاز', en: 'Commit vs delivered' }, subtitle: { ar: '24 من أصل 42 اكتملت', en: '24 of 42 completed' }, value: '57%', percent: '57%' },
            { title: { ar: 'معدل السحب اليومي', en: 'Daily pull rate' }, subtitle: { ar: 'متوسط 6 بطاقات يومياً', en: 'Avg 6 cards per day' }, value: '68%', percent: '68%' },
            { title: { ar: 'سعادة الفريق', en: 'Team morale' }, subtitle: { ar: 'استبيان هذا الأسبوع', en: 'Pulse survey this week' }, value: '92%', percent: '92%' }
          ]
        }
      ]
    });
  </script>
</body>
</html>
