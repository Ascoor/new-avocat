<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة Inventory & Stockroom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    body.font-english { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">
  <div class="min-h-screen flex flex-col lg:flex-row">
    <header class="lg:hidden border-b border-white/5 bg-white/5 backdrop-blur-sm px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div data-role="mobile-badge" class="h-11 w-11 rounded-2xl bg-white/10 text-white flex items-center justify-center text-lg font-semibold">IS</div>
        <div>
          <p data-role="mobile-brand-name" class="font-semibold"></p>
          <p data-role="mobile-brand-tagline" class="text-xs text-slate-300"></p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div data-role="language-switcher" class="inline-flex rounded-xl border border-white/10 p-1 bg-white/5"></div>
        <button id="sidebarToggle" class="inline-flex items-center gap-2 rounded-xl bg-white/10 px-4 py-2 text-sm font-semibold text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span data-role="open-label">فتح القائمة</span>
        </button>
      </div>
    </header>

    <div id="sidebarBackdrop" class="fixed inset-0 z-40 bg-black/60 opacity-0 pointer-events-none transition-opacity lg:hidden"></div>

    <aside id="sidebar" class="fixed inset-y-0 right-0 z-50 w-80 max-w-full transform translate-x-full border-l border-white/10 bg-slate-900/95 backdrop-blur-xl px-6 py-8 space-y-8 transition-transform duration-300 lg:static lg:translate-x-0 lg:w-80 lg:border-l-0 lg:bg-slate-900/60">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <div data-role="brand-badge" class="h-12 w-12 rounded-2xl bg-white/10 text-white flex items-center justify-center text-lg font-semibold">IS</div>
          <div>
            <p data-role="brand-name" class="text-lg font-semibold"></p>
            <p data-role="brand-tagline" class="text-sm text-slate-300"></p>
          </div>
        </div>
        <div data-role="sidebar-actions" class="flex items-center gap-2">
          <div data-role="language-switcher" class="hidden lg:inline-flex rounded-xl border border-white/10 bg-white/5 p-1"></div>
          <button id="sidebarClose" class="lg:hidden inline-flex items-center gap-2 rounded-xl border border-white/10 px-3 py-2 text-xs text-slate-200">
            <span data-role="close-label">إغلاق</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <nav data-role="sidebar-nav" class="space-y-2"></nav>
      <div data-role="sidebar-highlight"></div>
    </aside>

    <main class="flex-1 px-4 py-8 lg:px-12 lg:py-10 space-y-10">
      <div data-role="main-header" class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between"></div>
      <section data-role="stats" class="grid gap-6 md:grid-cols-2 xl:grid-cols-4"></section>
      <section data-role="panels" class="grid gap-6 xl:grid-cols-3"></section>
    </main>
  </div>

  <script src="dashboard-common.js"></script>
  <script>
    initDashboard({
      defaultLang: 'ar',
      meta: {
        title: {
          ar: 'لوحة Inventory & Stockroom',
          en: 'Inventory & Stockroom Dashboard'
        }
      },
      actions: {
        open: { ar: 'فتح القائمة', en: 'Open menu' },
        close: { ar: 'إغلاق', en: 'Close' }
      },
      brand: {
        badge: 'IS',
        name: { ar: 'Inventory Hub', en: 'Inventory Hub' },
        tagline: { ar: 'شبكة منتجات متجددة', en: 'Fresh product grid' }
      },
      theme: {
        accentGradient: 'from-sky-400 via-indigo-400 to-slate-100',
        accentText: 'text-sky-200',
        highlightBg: 'bg-sky-300/20 border-sky-200/40',
        badgeBg: 'bg-sky-300/30',
        badgeText: 'text-white'
      },
      nav: [
        { id: 'overview', icon: 'chart-bar', label: { ar: 'نظرة عامة', en: 'Overview' }, badge: { ar: 'مخزون حي', en: 'Live stock' } },
        { id: 'products', icon: 'shopping-bag', label: { ar: 'المنتجات', en: 'Products' } },
        { id: 'suppliers', icon: 'truck', label: { ar: 'الموردون', en: 'Suppliers' } },
        { id: 'alerts', icon: 'megaphone', label: { ar: 'التنبيهات', en: 'Alerts' } }
      ],
      highlight: {
        label: { ar: 'تنبيه المخزون', en: 'Stock alert' },
        value: 'منتجات منخفضة: 12 عنصر',
        description: {
          ar: 'قم بإطلاق أوامر إعادة التخزين للحفاظ على توفر الحقائب والسماعات الأكثر مبيعاً.',
          en: 'Raise replenishment orders to keep best-selling bags and headsets available.'
        }
      },
      header: {
        title: { ar: 'مخزون المتجر', en: 'Store inventory' },
        subtitle: {
          ar: 'شبكة منتجات ساطعة مع حالات المخزون وأدوات بحث وفلترة متقدمة.',
          en: 'A bright product grid with stock statuses and powerful search/filter controls.'
        },
        primary: { ar: 'بحث عن منتج', en: 'Find product' },
        secondary: { ar: 'تطبيق الفلترة', en: 'Apply filters' }
      },
      stats: [
        { icon: 'shopping-bag', label: { ar: 'منتجات متاحة', en: 'In stock' }, value: '148', delta: { ar: '+18 هذا الشهر', en: '+18 this month' }, trend: 'positive' },
        { icon: 'truck', label: { ar: 'مخزون منخفض', en: 'Low stock' }, value: '23', delta: { ar: '+5 تحتاج متابعة', en: '+5 need attention' }, trend: 'negative' },
        { icon: 'cube', label: { ar: 'نفاد المخزون', en: 'Out of stock' }, value: '7', delta: { ar: '-3 بعد التوريد الأخير', en: '-3 after last restock' }, trend: 'positive' },
        { icon: 'bank', label: { ar: 'أوامر إعادة التخزين', en: 'Restock orders' }, value: '$64K', delta: { ar: '4 أوامر قيد التنفيذ', en: '4 orders in progress' }, trend: 'neutral' }
      ],
      panels: [
        {
          id: 'collections',
          type: 'list',
          title: { ar: 'فئات بارزة', en: 'Featured collections' },
          action: { ar: 'تحديث حسب المبيعات', en: 'Sorted by sales' },
          items: [
            { icon: 'shopping-bag', title: { ar: 'حقائب Urban Flow', en: 'Urban Flow bags' }, subtitle: { ar: '12 لوناً - متوفر', en: '12 colours - available' }, value: 'متاح', delta: { ar: 'إعادة توريد خلال 5 أيام', en: 'Restock in 5 days' } },
            { icon: 'sparkles', title: { ar: 'سماعات PulseMax', en: 'PulseMax headsets' }, subtitle: { ar: '7 موديلات - قليل', en: '7 SKUs - low' }, value: 'قليل', delta: { ar: 'اطلب اليوم', en: 'Order today' } },
            { icon: 'film', title: { ar: 'كاميرات Vision', en: 'Vision cameras' }, subtitle: { ar: '3 عدسات ضمن الحزمة', en: '3-lens bundle' }, value: 'متاح', delta: { ar: 'عرض ترويجي نشط', en: 'Promo active' } }
          ]
        },
        {
          id: 'inventory-table',
          type: 'table',
          span: 'xl:col-span-2',
          title: { ar: 'حالة المخزون حسب المنتج', en: 'Inventory status by product' },
          action: { ar: 'تصدير CSV', en: 'Export CSV' },
          headers: [
            { ar: 'المنتج', en: 'Product' },
            { ar: 'المستودع', en: 'Warehouse' },
            { ar: 'الحالة', en: 'Status' }
          ],
          rows: [
            { name: { ar: 'Backpack Apex 28L', en: 'Backpack Apex 28L' }, metric: 'المستودع الرئيسي', delta: { ar: 'متاح - 214 وحدة', en: 'Available - 214 units' }, trend: 'positive' },
            { name: { ar: 'Headphones AirLite', en: 'Headphones AirLite' }, metric: 'مركز الشحن - جدة', delta: { ar: 'قليل - 36 وحدة', en: 'Low - 36 units' }, trend: 'negative' },
            { name: { ar: 'Camera Atlas Pro', en: 'Camera Atlas Pro' }, metric: 'المستودع المركزي', delta: { ar: 'متاح - 58 وحدة', en: 'Available - 58 units' }, trend: 'positive' },
            { name: { ar: 'Smartwatch Nova', en: 'Smartwatch Nova' }, metric: 'محطة الرياض', delta: { ar: 'نفاد - طلب توريد', en: 'Out - restock ordered' }, trend: 'negative' }
          ]
        },
        {
          id: 'replenishment',
          type: 'progress',
          title: { ar: 'خطة إعادة التوريد', en: 'Replenishment plan' },
          items: [
            { title: { ar: 'الحقائب', en: 'Bags' }, subtitle: { ar: 'أولوية عالية - وصول غداً', en: 'High priority - arrives tomorrow' }, value: '82%', percent: '82%' },
            { title: { ar: 'الإلكترونيات', en: 'Electronics' }, subtitle: { ar: 'تجميع طلب المورد', en: 'Supplier order compiling' }, value: '54%', percent: '54%' },
            { title: { ar: 'الإكسسوارات', en: 'Accessories' }, subtitle: { ar: 'تقييم بطيء الحركة', en: 'Slow-mover review' }, value: '39%', percent: '39%' }
          ]
        },
        {
          id: 'timeline',
          type: 'timeline',
          span: 'xl:col-span-3',
          title: { ar: 'آخر تحديثات المخزون', en: 'Latest inventory updates' },
          items: [
            { icon: 'truck', title: { ar: 'وصول شحنة الحقيبة', en: 'Bag shipment received' }, subtitle: { ar: '120 وحدة دخلت المخزون', en: '120 units checked in' }, time: { ar: 'قبل ساعة', en: '1 hour ago' } },
            { icon: 'megaphone', title: { ar: 'تنبيه ترويج الصيف', en: 'Summer promo alert' }, subtitle: { ar: 'زيادة الطلب على PulseMax', en: 'PulseMax demand spike' }, time: { ar: 'اليوم', en: 'Today' } },
            { icon: 'bank', title: { ar: 'دفعة للمورد Vision', en: 'Vision supplier payment' }, subtitle: { ar: 'تم تحرير 18,000$', en: '$18,000 released' }, time: { ar: 'أمس', en: 'Yesterday' } }
          ]
        }
      ]
    });
  </script>
</body>
</html>
